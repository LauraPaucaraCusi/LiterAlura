# URL de SQLite (crear� el archivo si no existe)
spring.datasource.url=jdbc:sqlite:src/main/resources/db/literalura.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Dialecto correcto (viene del paquete community)
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Que Hibernate cree/actualice tablas si hay entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
