plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'org.example'
version = '1.0.0'
sourceCompatibility = '17'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'                // Spring Boot básico
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'           // Para JDBC
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'       // Para JPA y repositories
    runtimeOnly 'org.xerial:sqlite-jdbc:3.42.0.0'                                 // Driver SQLite
    testImplementation 'org.springframework.boot:spring-boot-starter-test'       // Tests
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
